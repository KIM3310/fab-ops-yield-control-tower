[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-ops-platform"
version = "1.1.0"
description = "Unified semiconductor ops platform: fab control tower (alarms, lots, tools, recovery board) and scanner field response (field incidents, subsystem escalation, qualification review)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Doeon Kim"}]
license = "MIT"
keywords = ["semiconductor", "fab-ops", "yield", "fastapi", "manufacturing"]
dependencies = [
  "fastapi==0.141.1",
  "starlette>=1.3.1",
  "uvicorn==0.52.1",
  "sqlalchemy==2.0.51",
  "prometheus-client==0.26.0",
  "boto3==1.43.66",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.2",
  "mypy==1.20.2",
  "pytest-cov==6.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["static/*.html", "static/*.js", "static/*.css"]
"app.domains.fab_ops" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[project.urls]
Repository = "https://github.com/KIM3310/fab-ops-yield-control-tower"
