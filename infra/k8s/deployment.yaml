apiVersion: apps/v1
kind: Deployment
metadata:
  name: semiconductor-ops-platform
  labels:
    app: semiconductor-ops-platform
    component: api
spec:
  # SQLite is a single-writer deployment. Migrate to a shared external database
  # before increasing replicas or enabling rolling multi-pod updates.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: semiconductor-ops-platform
  template:
    metadata:
      labels:
        app: semiconductor-ops-platform
        component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/kim3310/fab-ops-yield-control-tower:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: semiconductor-ops-config
          env:
            # Required production credentials are created out-of-band. The
            # repository intentionally contains references, never Secret data.
            - name: FAB_OPS_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: semiconductor-ops-secrets
                  key: FAB_OPS_OPERATOR_TOKEN
            - name: FAB_OPS_HANDOFF_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: semiconductor-ops-secrets
                  key: FAB_OPS_HANDOFF_SIGNING_KEY
            - name: SCANNER_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: semiconductor-ops-secrets
                  key: SCANNER_OPERATOR_TOKEN
            - name: SCANNER_RESPONSE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: semiconductor-ops-secrets
                  key: SCANNER_RESPONSE_SIGNING_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: semiconductor-ops-data
